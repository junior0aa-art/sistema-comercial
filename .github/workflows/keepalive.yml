name: Supabase Keepalive
on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:
jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/workspaces?select=id&limit=1")
          echo "Status: $STATUS"
          [ "$STATUS" = "200" ] && echo "Supabase ativo!" || echo "Aviso: $STATUS"
