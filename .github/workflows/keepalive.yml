
name: Supabase Keepalive

on:
  schedule:
    - cron: '0 8 */3 * *'
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

        run: |
          if [ -z "$SB_URL" ] || [ -z "$SB_KEY" ]; then
            echo "ERRO: Secrets não configurados."
            exit 1
          fi

          echo "Iniciando verificação do Supabase..."

          if STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 30 \
            -H "apikey: $SB_KEY" \
            -H "Authorization: Bearer $SB_KEY" \
            "$SB_URL/rest/v1/workspaces?select=id&limit=1"); then

            echo "Status HTTP: $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "Supabase ativo!"
            else
              echo "ERRO: Supabase respondeu com HTTP $STATUS"
              exit 1
            fi

          else
            CURL_EXIT=$?
            echo "ERRO: Falha na conexão. Código CURL: $CURL_EXIT"
            exit "$CURL_EXIT"
          fi
